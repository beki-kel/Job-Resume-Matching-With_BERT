version: '3.8'

services:
  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: resume_matcher_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - resume_matcher_network

  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_matcher_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_CHANNELS=${TELEGRAM_CHANNELS}
      - MODEL_PATH=/app/model
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - MAX_POSTS_PER_CHANNEL=${MAX_POSTS_PER_CHANNEL:-100}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
    volumes:
      - ../fine_tuned_telegram_model:/app/model:ro
      - ./sessions:/app/sessions
      - ./app:/app/app:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - resume_matcher_network

volumes:
  redis_data:
    driver: local

networks:
  resume_matcher_network:
    driver: bridge
